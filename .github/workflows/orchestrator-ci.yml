name: Orchestrator CI

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "docs/**"
      - "CONTRIBUTING_ORCHESTRATOR.md"
      - ".ai-job-search.config.example.json"
      - ".github/workflows/orchestrator-ci.yml"
      - "requirements-dev.txt"
  push:
    branches:
      - master
      - main
    paths:
      - "orchestrator/**"
      - "docs/**"
      - "CONTRIBUTING_ORCHESTRATOR.md"
      - ".ai-job-search.config.example.json"
      - ".github/workflows/orchestrator-ci.yml"
      - "requirements-dev.txt"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and smoke tests
        run: python -m pytest orchestrator/tests
