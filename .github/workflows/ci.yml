name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  security-guards:
    name: Security guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py

  latex-smoke:
    name: Compile example documents
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - name: Compile CV
        run: |
          cd cv
          lualatex -interaction=nonstopmode -halt-on-error main_example.tex
      - name: Compile cover letter
        run: |
          cd cover_letters
          xelatex -interaction=nonstopmode -halt-on-error cover_example.tex
      - name: Verify PDFs
        run: |
          python3 tools/verify_pdf.py cv/main_example.pdf --min-chars 100
          python3 tools/verify_pdf.py cover_letters/cover_example.pdf --min-chars 100

  cli-checks:
    name: Portal CLI checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          [
            freehire-search,
            jobbank-search,
            jobdanmark-search,
            jobindex-search,
            jobnet-search,
            linkedin-search,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun test
        working-directory: .agents/skills/${{ matrix.tool }}/cli
