# Builds the agency console as a Windows executable and an installer.
#
# This cannot be built anywhere but Windows: PyInstaller freezes the running
# interpreter and does not cross-compile, so a Linux runner produces a Linux
# binary, not a .exe. The job therefore runs on windows-latest and hands back
# the artifacts for download.
#
# Deliberately NOT on every push. A packaging run is minutes of Windows runner
# time and produces a binary nobody asked for; it fires on demand
# (workflow_dispatch) or when a version tag is pushed.
#
# The API key is never a build input. The console resolves it per user at
# runtime - from ANTHROPIC_API_KEY, or the DPAPI-encrypted store written by
# `agency key set` - so no secret is needed here, and nothing extractable
# from the binary would be worth extracting. Do not add one.
#
# The executable is unsigned. Windows SmartScreen will warn on first run.
# Signing needs a code-signing certificate held as a repository secret; add
# that step before handing the installer to anyone outside the agency.

name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Freeze and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # A broken build is worse than no build - the tests gate the artifact.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Freeze the console
        # tenancy and credentials are imported through a sys.path insert that
        # PyInstaller's static analysis cannot follow, so they are named
        # explicitly - without this the binary builds and then dies on first
        # run with ModuleNotFoundError.
        run: >
          pyinstaller --onefile --console
          --name agency
          --paths tools
          --hidden-import tenancy
          --hidden-import credentials
          tools/agency.py

      - name: Smoke-test the executable
        # `doctor` exits 1 on this runner (no LaTeX installed) and that is
        # correct behaviour, so the smoke test uses commands that must succeed
        # anywhere. It proves the binary starts and its imports resolved.
        run: |
          .\dist\agency.exe --help
          .\dist\agency.exe client list
          .\dist\agency.exe key status; if ($LASTEXITCODE -ne 1) {
            Write-Error "expected exit 1 from `key status` with no key configured"
            exit 1
          }
          Write-Host "smoke test passed"

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" packaging\agency.iss

      - name: Upload executable
        # NOTE: pinned by tag, not SHA, unlike the actions above - this repo's
        # convention is SHA pinning and this should be tightened to match.
        uses: actions/upload-artifact@v4
        with:
          name: agency-exe
          path: dist/agency.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: agency-installer
          path: packaging/output/agency-setup.exe
          if-no-files-found: error
