# Build the installable Job Search Desk for Windows, macOS, and Linux.
# Tag desk-v1.0.0 (or later) to publish a GitHub Release.

name: Desk release

on:
  push:
    tags:
      - "desk-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Desk unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run build:renderer
        working-directory: gui
      - run: npm test
        working-directory: gui

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            args: --win --x64
          - os: macos-latest
            label: macOS arm64
            args: --mac --arm64
          - os: macos-13
            label: macOS x64
            args: --mac --x64
          - os: ubuntu-latest
            label: Linux x64
            args: --linux --x64
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build:renderer
      - run: npm test
      - run: npm run rebuild:native
      - run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:packaged
        env:
          JOB_SEARCH_REQUIRE_PACKAGED: "1"
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desk-${{ matrix.label }}
          path: gui/release/JobSearchDesk-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desk-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Job Search Desk ${{ github.ref_name }}
          body: |
            Installable Job Search Desk for macOS, Windows, and Linux.

            1. Run the installer. Windows adds Start Menu and Desktop shortcuts and opens the app when setup finishes.
            2. Open an existing job-search folder, or create a new copy of the public repo (Git is optional).
            3. The desk opens the conversation when you are already signed in. It only asks you to log in to Claude Code when `claude auth status` reports you are signed out. If Claude Code is missing, the app installs it, then uses the same claude.ai login you already use in Chrome.
            4. macOS: if Gatekeeper blocks the unsigned build, open it from Finder with right-click → Open.

            The app talks to your local Claude Code subscription. It does not replace `/setup` for your profile.
          files: artifacts/JobSearchDesk-*
          fail_on_unmatched_files: true
