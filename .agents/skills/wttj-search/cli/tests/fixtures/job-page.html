  "description": "<h2>About GitGuardian</h2><p><span>GitGuardian is a global cybersecurity scale-up. The company is based in Paris, New-York City, Boston.</span></p><p><span>Among our early investors who saw our market value proposition, are the co-founder of GitHub, Scott Chacon, along with Solomon Hykes, Docker&#39;s co-founder. American and European top-tier VC firms have also invested in GitGuardian who raised its series C early 2026.</span></p><p><span>GitGuardian helps enterprises close credential-based breach paths. It finds secrets wherever they live, prioritizes remediation based on rich context, and prevents new exposure across code, systems, and AI. The GitGuardian platform is already used by more than 600K developers worldwide and by 50 of the fortune 500!</span></p><h2>About your team and your mission</h2><p>As a Senior Data Engineer, you will join a team of 3 passionate and highly-skilled engineers who are pivotal to GitGuardian&#39;s growth and success. Our team&#39;s scope is uniquely broad, encompassing the entire data lifecycle—from ingestion and transformation to delivering critical business insights and enhancing our product with data-driven features. You&#39;ll be at the crossroads of Business Intelligence and Product development, with a direct impact on our company&#39;s trajectory.</p><p>Your main responsibilities will be to:</p><ul><li><p>Design, build, and maintain our data platform, ensuring its scalability, reliability, and performance to meet the demands of a high-growth environment.</p></li><li><p>Develop and optimize robust ELT pipelines, leveraging tools like Fivetran and Airbyte for standard sources and building custom connectors where needed, to ingest data from a wide variety of sources including PostgreSQL, Elasticsearch, and third-party APIs (e.g., Hubspot, GitLab, Notion).</p></li><li><p>Architect and implement sophisticated data models in our Snowflake data warehouse, transforming raw data into clean, business-ready tables that serve as the single source of truth.</p></li><li><p>Collaborate on impactful business projects, working closely with stakeholders across Sales, Marketing, and Product to understand their needs and deliver data solutions that drive strategic decisions.</p></li><li><p>Power our customer-facing analytics, developing and exposing data within the GitGuardian product to provide our users with valuable insights.</p></li><li><p>Champion data quality and governance across the organization, establishing best practices and ensuring the integrity of our data assets.</p></li><li><p>Mentor and guide other engineers, sharing your expertise and contributing to the continuous improvement of our team&#39;s skills and processes.</p></li></ul><p><strong>Technical Environment</strong></p><ul><li><p><strong>Core Languages:</strong> Python, SQL</p></li><li><p><strong>Data Warehouse:</strong> Snowflake</p></li><li><p><strong>Orchestration &amp; Deployment:</strong> Dagster, Kubernetes, Docker, Terraform</p></li><li><p><strong>Data Ingestion: </strong>Fivetran, Airbyte, custom scripts</p></li><li><p><strong>Data Visualization:</strong> Metabase</p></li><li><p><strong>Data Sources:</strong> PostgreSQL, Elasticsearch, various APIs</p></li></ul><h2>About you</h2><p><em>If you think you match at least 70% of these criteria, please apply!</em></p><p>Here&#39;s what we consider essential for success in this role:</p><ul><li><p>5+ years experience in data engineering, with a proven track record of building and managing complex data platforms in a cloud environment.</p></li><li><p>Expert-level proficiency in Python and SQL; you are comfortable writing clean, efficient, and production-ready code.</p></li><li><p>A comprehensive understanding of modern data architectures, including data warehousing, data modeling, and ETL/ELT best practices.</p></li><li><p>Hands-on experience with our core technologies or their equivalents (e.g., Airflow instead of Dagster; Redshift or BigQuery instead of Snowflake).</p></li><li><p>A strong business sense and the ability to translate complex business requirements into technical solutions that have a tangible impact.</p></li><li><p>A proactive and ownership-driven mindset, with a passion for solving challenging problems and driving projects from conception to completion.</p></li><li><p>Excellent communication skills, with the ability to articulate technical concepts to both technical and non-technical audiences.</p></li></ul><p>The following skills would strengthen your application but aren&#39;t required:</p><ul><li><p>Previous experience in a high-growth B2B SaaS or cybersecurity company.</p></li><li><p>Experience with containerization and orchestration technologies (Docker, Kubernetes).</p></li><li><p>Knowledge of Infrastructure as Code (e.g., Terraform).</p></li></ul><h2>The interview process</h2><p><em>At GitGuardian, we are committed to building a diverse, equitable and inclusive workforce.</em></p><p><em>We will ask for your gender identity on the application page to help us understand the diversity of our applicant pool and to track our progress in attracting and hiring a diverse workforce. The information is optional and will not be disclosed to the hiring manager or the interview team and will not be considered in the hiring process. We appreciate your willingness to share this with us so that we can continue to improve our diversity, equity and inclusion efforts.</em></p><p><strong>1. Interview with your future manager (60 minutes)</strong></p><ul><li><p><strong>Purpose:</strong> <em>To align on your experience, working style, and your high-level approach to data architecture and data modeling. This is a chance to discuss technical philosophy and ensure your vision matches the team&#39;s direction.</em></p></li><li><p><strong>Skills Assessed:</strong> <em>We assess your soft skills (ownership, communication), motivation, and your high-level system design and architectural thinking.</em></p></li></ul><p><strong>2. Technical interview (60 minutes)</strong></p><ul><li><p><strong>Purpose:</strong> <em>To validate your hands-on technical skills through practical coding exercises and operational scenarios. We want to see how you write code, optimize queries, and troubleshoot real-world problems.</em></p></li><li><p><strong>Skills Assessed:</strong> <em>Your Python coding proficiency, advanced SQL skills, and debugging abilities. We will focus on your approach to writing clean, efficient code and handling operational failures.</em></p></li></ul><p><strong>3. Final interview with an Executive Manager (30 minutes)</strong></p><ul><li><p><strong>Purpose:</strong> <em>To ensure your vision and working style align with GitGuardian&#39;s broader company strategy and values.</em></p></li><li><p><strong>Skills Assessed:</strong> <em>Your high-level business acumen, strategic thinking, and cultural alignment. We want to understand your potential long-term impact on the company.</em></p></li></ul><h2>Benefits</h2><ul><li><p>💰 Package that includes BSPCE</p></li><li><p>🍜 Lunch voucher (Swile, 12€ at 50%)</p></li><li><p>👟 Sponsored Wellpass (gymlib)</p></li><li><p>🏥 Non-charged health insurance for children (Sidecare / Generali)</p></li><li><p>💻 Up to €300 to improve your home office set-up</p></li><li><p>🌴 Yearly holiday allowance</p></li><li><p>🤝 Referral bonus of 4000€ for any new Guardian we might hire thanks to you</p></li><li><p>🎡 Team building: monthly budget dedicated to each employee that you can spend as you wish, with colleagues (latest examples to date: Michelin star restaurant, karaoke, stand-up show, kitesurfing week-end, ...)</p></li></ul><p>And also...</p><ul><li><p>🏡 Remote policy: hybrid (3 days/week at the office in Paris)</p></li><li><p>📈 Opportunities for career development in the long term</p></li></ul><h2>More about GitGuardian!</h2><p><strong>Products</strong></p><ul><li><p>Understand how GitGuardian works in this short <a rel=\"noopener noreferrer\" target=\"_blank\" href=\"https://www.youtube.com/watch?v=8it0HnAk_kw\">video</a>!</p></li><li><p>Want to go even further? Check out our <a rel=\"noopener noreferrer\" target=\"_blank\" href=\"https://roadmap.gitguardian.com/tabs/10-ongoing\">public roadmap</a>!</p></li><li><p>Check out the <a rel=\"noopener noreferrer\" target=\"_blank\" href=\"https://www.gitguardian.com/state-of-secrets-sprawl-report-2025\">State of Secrets Sprawl Report</a> to understand our mission and the industry.</p></li><li><p>Our solutions are already used by hundreds of thousands of developers in all industries and <strong>GitGuardian platform is the n°1 app on the</strong> <a rel=\"noopener noreferrer\" target=\"_blank\" href=\"https://github.com/marketplace?type=apps\">GitHub marketplace</a> 🔥</p></li></ul><p><strong>Clients</strong></p><ul><li><p>GitGuardian helps organizations find exposed sensitive information that could often lead to tens of millions of dollars in potential damage.</p></li><li><p>More than 70% of our customers are in the United States.</p></li><li><p>Many F500 companies use GitGuardian&#39;s platform.</p></li></ul><p><strong>People</strong></p><ul><li><p>The Guardians are <strong>knowledgeable</strong>, committed, serious, <strong>aligned with the company’s mission, and true team players</strong>: always willing to help each other grow our skill sets!</p></li><li><p>The team is diverse and we hail from more than 20 different countries.</p></li><li><p>We are also <strong>agile, remote-friendly, </strong>and <strong>fun people</strong> to work with.</p></li><li><p>You will get <strong>trust &amp; autonomy</strong> on your perimeter with a very <strong>transparent internal communication</strong> and a strong impact on the company development.</p></li></ul>",
