<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Search Workspace{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Job Search Workspace home">
      <span class="brand-mark">JS</span><span>Job Search Workspace</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="/">Dashboard</a><a href="/discover">Discover jobs</a><a href="/user-profile">User Profile</a><a href="/profile">Evidence Profile</a>
      <a class="button button-small" href="/new-job">Add job</a>
    </nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
