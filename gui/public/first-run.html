<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b09">
  <meta name="color-scheme" content="dark">
  <title>Job Search Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Fraunces:ital,opsz,wght@0,9..144,360;0,9..144,520;0,9..144,700;1,9..144,360&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desk.css">
</head>
<body class="first-run">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main class="first-run-shell">
    <p class="mark" aria-hidden="true">D</p>
    <p class="brand">Desk</p>
    <p class="brand-sub">US job search</p>
    <h2>Choose a job-search folder</h2>
    <p class="lede">This app talks to Claude Code inside a copy of the repo. Nothing leaves this computer.</p>
    <div class="choice-grid">
      <button type="button" id="open-folder" class="choice">
        <span class="n">01</span>
        <strong>Open existing folder</strong>
        <em>A clone you already have, with AGENTS.md and gui/</em>
      </button>
      <button type="button" id="clone-folder" class="choice">
        <span class="n">02</span>
        <strong>Create a new copy</strong>
        <em>Downloads the public US framework. Git is optional.</em>
      </button>
    </div>
    <p id="first-run-status" class="status first-run-status">Pick a folder to continue.</p>
    <p class="seal">Local only · Claude stays on this machine</p>
  </main>
  <script>
    const status = document.getElementById("first-run-status");
    const openBtn = document.getElementById("open-folder");
    const cloneBtn = document.getElementById("clone-folder");

    function api() {
      return window.deskApp;
    }

    if (!api()) {
      status.textContent = "This window is missing the Desk connection. Quit and reopen Job Search Desk from the Start Menu.";
    }

    async function run(kind) {
      const desk = api();
      if (!desk) {
        status.textContent = "This window is missing the Desk connection. Quit and reopen Job Search Desk from the Start Menu.";
        return;
      }
      openBtn.disabled = true;
      cloneBtn.disabled = true;
      status.textContent =
        kind === "open"
          ? "Pick the folder that contains AGENTS.md and gui/."
          : "Choose where to create the folder, then wait while it downloads.";
      try {
        const result = kind === "open" ? await desk.openFolder() : await desk.cloneWorkspace();
        if (result?.error) status.textContent = result.error;
      } catch (err) {
        status.textContent = err.message || "The folder dialog did not open.";
      } finally {
        openBtn.disabled = false;
        cloneBtn.disabled = false;
      }
    }

    openBtn.addEventListener("click", () => run("open"));
    cloneBtn.addEventListener("click", () => run("clone"));
  </script>
</body>
</html>
