appId: com.ai-job-search.desk
productName: Job Search Desk
copyright: AI Job Search
asar: true
directories:
  output: release
  buildResources: build
files:
  - claude.mjs
  - defaults.mjs
  - electron-main.mjs
  - preload.cjs
  - server.mjs
  - workspace.mjs
  - package.json
  - public/**/*
asarUnpack:
  - preload.cjs
extraMetadata:
  main: electron-main.mjs
win:
  executableName: JobSearchDesk
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: JobSearchDesk-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Job Search Desk
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  uninstallDisplayName: Job Search Desk
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  target:
    - dmg
    - zip
  artifactName: JobSearchDesk-${version}-mac-${arch}.${ext}
linux:
  category: Office
  icon: build/icon.png
  target:
    - AppImage
  artifactName: JobSearchDesk-${version}-linux-${arch}.${ext}
