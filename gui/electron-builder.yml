appId: com.ai-job-search.desk
productName: Job Search Desk
copyright: AI Job Search
asar: true
directories:
  output: release
  buildResources: build
files:
  - "*.mjs"
  - terminal/**/*
  - public/**/*
  - public/dist/**/*
  - package.json
  - preload.cjs
asarUnpack:
  - preload.cjs
  - node_modules/node-pty/**/*
  - "**/*.node"
npmRebuild: true
extraMetadata:
  main: electron-main.mjs
win:
  executableName: JobSearchDesk
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: JobSearchDesk-${version}-win-${arch}.${ext}
# Without its own name the portable exe overwrites the NSIS installer:
# both targets otherwise resolve to JobSearchDesk-<version>-win-<arch>.exe.
portable:
  artifactName: JobSearchDesk-${version}-win-${arch}-portable.${ext}
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Job Search Desk
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  uninstallDisplayName: Job Search Desk
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  target:
    - dmg
    - zip
  artifactName: JobSearchDesk-${version}-mac-${arch}.${ext}
linux:
  category: Office
  icon: build/icon.png
  target:
    - AppImage
  artifactName: JobSearchDesk-${version}-linux-${arch}.${ext}
